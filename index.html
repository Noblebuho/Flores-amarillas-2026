<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Mensaje Especial de NobleBuho 🦉🌻</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fffde7 0%, #fff59d 50%, #ffee58 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: #4a3b00;
            position: relative;
        }

        /* Partículas flotantes de fondo */
        .particle {
            position: absolute;
            background: rgba(255, 235, 59, 0.6);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* Contenedor Principal */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.3), 
                        0 0 20px rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(255, 235, 59, 0.5);
            animation: fadeIn 1.5s ease-out;
            position: relative;
            z-index: 10;
            margin: 20px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Encabezado */
        .sender-badge {
            display: inline-block;
            background: #fff176;
            color: #5d4037;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            animation: pulseBadge 2s infinite alternate;
        }

        @keyframes pulseBadge {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8em;
            color: #f57f17;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-size: 1.05em;
            color: #616161;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Animación del Girasol Central */
        .sunflower-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 25px auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .sunflower-container:hover {
            transform: scale(1.08);
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #5d4037 0%, #3e2723 100%);
            border-radius: 50%;
            z-index: 2;
            box-shadow: inset 0 0 8px #1b0000;
        }

        .petals {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotateFlower 20s linear infinite;
        }

        @keyframes rotateFlower {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .petal {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 28px;
            height: 70px;
            background: linear-gradient(to top, #fbc02d, #ffee58);
            border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
            transform-origin: center bottom;
            margin-left: -14px;
            margin-top: -70px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Mensajes Inspiradores Carousel */
        .message-box {
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255, 253, 231, 0.6);
            border-radius: 15px;
            border-left: 4px solid #fbc02d;
        }

        .message {
            font-size: 1.05em;
            font-style: italic;
            color: #4e342e;
            transition: opacity 0.5s ease-in-out;
            line-height: 1.5;
        }

        /* Botón Interactividad */
        .btn {
            background: linear-gradient(45deg, #fbc02d, #f57f17);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1em;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(245, 127, 23, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }

        .btn:hover {
            background: linear-gradient(45deg, #f57f17, #fbc02d);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(245, 127, 23, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Flores cayendo animadas */
        .falling-flower {
            position: fixed;
            top: -10%;
            font-size: 1.5rem;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        footer {
            margin-top: 20px;
            font-size: 0.85em;
            color: #8d6e63;
        }

        .owl-icon {
            font-size: 1.2em;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="sender-badge">
            <span class="owl-icon">🦉</span> Enviado por NobleBuho
        </div>
        
        <h1>¡Que tengas el mejor de los días!</h1>
        
        <p class="subtitle">
            Un detalle amarillo para iluminar tu jornada con alegría, calidez y la mejor energía posible.
        </p>

        <!-- Flor Principal Animada -->
        <div class="sunflower-container" onclick="triggerEffect()" title="¡Haz clic para ver la magia!">
            <div class="petals" id="petalsContainer"></div>
            <div class="center-circle"></div>
        </div>

        <!-- Caja de Mensajes Bonitos -->
        <div class="message-box">
            <p class="message" id="quoteText">"Que hoy la vida te sonría tan brillante como un ramo de flores amarillas."</p>
        </div>

        <button class="btn" onclick="nextMessage()">Recibir más luz ✨</button>

        <footer>
            Con mucho cariño y los mejores deseos ✨
        </footer>
    </div>

    <script>
        // Generar pétalos dinámicamente para la flor central
        const petalsContainer = document.getElementById('petalsContainer');
        const totalPetals = 16;
        for (let i = 0; i < totalPetals; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.transform = `rotate(${i * (360 / totalPetals)}deg)`;
            petalsContainer.appendChild(petal);
        }

        // Lista de mensajes bonitos
        const messages = [
            ""Que hoy la vida te sonría tan brillante como un ramo de flores amarillas."",
            ""Eres una persona especial que merece un día lleno de luz, calma y sonrisas sinceras."",
            ""Que cada momento de hoy esté lleno de la calidez del sol y la frescura de las flores."",
            ""El mundo es un lugar más bonito porque tú estás en él. ¡A brillar hoy!"",
            ""Las flores amarillas simbolizan la alegría, la amistad y los comienzos hermosos. Que tengas el mejor día."",
            ""Un abrazo suave en forma de flores amarillas para recordarte lo mucho que vales.""
        ];

        let messageIndex = 0;

        // Web Audio API para generar tonos suaves sin necesidad de archivos externos
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSoftChime(freq) {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Envolvente suave
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.2);
        }

        function playArpeggio() {
            const notes = [523.25, 659.25, 783.99, 1046.50]; // Do, Mi, Sol, Do (Agradable y luminoso)
            notes.forEach((freq, index) => {
                setTimeout(() => {
                    playSoftChime(freq);
                }, index * 120);
            });
        }

        // Cambiar mensaje con efecto
        function nextMessage() {
            playArpeggio();
            createFlowerShower(5);

            const quoteText = document.getElementById('quoteText');
            quoteText.style.opacity = 0;

            setTimeout(() => {
                messageIndex = (messageIndex + 1) % messages.length;
                quoteText.textContent = messages[messageIndex];
                quoteText.style.opacity = 1;
            }, 400);
        }

        // Efecto especial al hacer clic en la flor central
        function triggerEffect() {
            playArpeggio();
            createFlowerShower(15);
        }

        // Lluvia de flores amarillas cayendo
        function createFlowerShower(amount) {
            const flowerIcons = ['🌼', '🌻', '✨', '💛', '🌸'];
            
            for (let i = 0; i < amount; i++) {
                setTimeout(() => {
                    const flower = document.createElement('div');
                    flower.className = 'falling-flower';
                    flower.textContent = flowerIcons[Math.floor(Math.random() * flowerIcons.length)];
                    
                    flower.style.left = Math.random() * 100 + 'vw';
                    flower.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    flower.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
                    
                    document.body.appendChild(flower);

                    setTimeout(() => {
                        flower.remove();
                    }, 5000);
                }, i * 100);
            }
        }

        // Generar partículas ambientales de fondo
        function createParticles() {
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 8 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.animationDuration = `${Math.random() * 10 + 5}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                document.body.appendChild(particle);
            }
        }

        createParticles();
    </script>
</body>
</html>
